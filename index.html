<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>آزمایش Mini App ایتا</title>

    <!-- SDK ایتا -->
    <script src="https://developer.eitaa.com/eitaa-web-app.js"></script>

    <style>
        body {
            font-family: Tahoma, Arial, sans-serif;
            max-width: 650px;
            margin: 30px auto;
            padding: 20px;
            line-height: 2;
        }

        button {
            padding: 12px 18px;
            margin: 8px 0;
            cursor: pointer;
        }

        button:disabled {
            cursor: not-allowed;
            opacity: 0.6;
        }

        pre {
            direction: ltr;
            text-align: left;
            white-space: pre-wrap;
            overflow-wrap: anywhere;
            background: #f2f2f2;
            padding: 12px;
            border-radius: 8px;
        }
    </style>
</head>

<body>
    <h2>آزمایش اتصال به ایتا</h2>

    <p id="environment">در حال بررسی محیط اجرا...</p>
    <p id="initDataStatus"></p>

    <button id="contactButton" disabled>
        درخواست اشتراک شماره تماس
    </button>

    <button id="registerButton" disabled>
        ثبت‌نام در MainApi
    </button>

    <h3>نتیجه آزمایش</h3>
    <pre id="result">هنوز آزمایشی انجام نشده است.</pre>

    <script>
        const environment = document.getElementById("environment");
        const initDataStatus = document.getElementById("initDataStatus");
        const contactButton = document.getElementById("contactButton");
        const registerButton = document.getElementById("registerButton");
        const result = document.getElementById("result");

        const API_URL =
            "https://7k8xz7bn-7232.inc1.devtunnels.ms/api/v1/eitaa/users/register";

        const webApp = window.Eitaa?.WebApp;

        // initData فقط در حافظه صفحه نگهداری می‌شود.
        let rawInitData = "";

        function showResult(data) {
            result.textContent = JSON.stringify(data, null, 2);
        }

        // بررسی محیط اجرا و دریافت initData
        if (!webApp) {
            environment.textContent =
                "SDK ایتا در دسترس نیست. صفحه را داخل Mini App ایتا باز کنید.";

            initDataStatus.textContent =
                "دریافت initData هنوز ممکن نیست.";
        } else {
            webApp.ready();

            rawInitData = webApp.initData || "";

            environment.textContent = "SDK ایتا شناسایی شد.";

            initDataStatus.textContent = rawInitData
                ? `initData دریافت شد؛ طول رشته: ${rawInitData.length} کاراکتر`
                : "initData خالی است؛ نحوه باز کردن Mini App را بررسی کنید.";

            contactButton.disabled =
                typeof webApp.requestContact !== "function";

            registerButton.disabled = rawInitData.length === 0;

            showResult({
                sdkAvailable: true,
                initDataReceived: rawInitData.length > 0,
                initDataLength: rawInitData.length,
                initDataKeys: rawInitData
                    ? [...new URLSearchParams(rawInitData).keys()]
                    : [],
                requestContactAvailable:
                    typeof webApp.requestContact === "function"
            });
        }

        // ثبت‌نام کاربر در MainApi
        async function registerUser() {
            if (!rawInitData) {
                showResult({
                    success: false,
                    message: "initData خالی است. Mini App را داخل ایتا باز کنید."
                });
                return;
            }

            registerButton.disabled = true;
            result.textContent = "در حال ارسال درخواست به MainApi...";

            try {
                const response = await fetch(API_URL, {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        initData: rawInitData
                    })
                });

                const responseText = await response.text();

                let responseData;

                try {
                    responseData = responseText
                        ? JSON.parse(responseText)
                        : null;
                } catch {
                    responseData = responseText;
                }

                showResult({
                    httpStatus: response.status,
                    success: response.ok,
                    response: responseData
                });
            } catch (error) {
                showResult({
                    success: false,
                    message:
                        "ارتباط با MainApi برقرار نشد. وضعیت API، تونل و CORS را بررسی کنید.",
                    error: error.message
                });
            } finally {
                registerButton.disabled = rawInitData.length === 0;
            }
        }

        registerButton.addEventListener("click", registerUser);

        // درخواست اشتراک شماره تماس از ایتا
       
function inspectContactData(data) {
    const sensitiveKey =
        /phone|contact|hash|signature|token|secret|auth|user|name/i;

    function inspect(value) {
        if (value === null) {
            return { type: "null" };
        }

        if (Array.isArray(value)) {
            return {
                type: "array",
                length: value.length
            };
        }

        if (typeof value !== "object") {
            return {
                type: typeof value,
                length: typeof value === "string"
                    ? value.length
                    : undefined
            };
        }

        const fields = {};

        for (const [key, item] of Object.entries(value)) {
            if (sensitiveKey.test(key)) {
                fields[key] = {
                    type: item === null
                        ? "null"
                        : Array.isArray(item)
                            ? "array"
                            : typeof item,
                    value: "[مخفی]"
                };
            } else if (item !== null &&
                       typeof item === "object") {
                fields[key] = inspect(item);
            } else {
                fields[key] = {
                    type: item === null
                        ? "null"
                        : typeof item,
                    value: typeof item === "boolean" ||
                           typeof item === "number"
                        ? item
                        : "[مخفی]"
                };
            }
        }

        return {
            type: "object",
            fields
        };
    }

    return inspect(data);
}

contactButton.addEventListener("click", () => {
    if (!webApp ||
        typeof webApp.requestContact !== "function") {
        showResult({
            success: false,
            message: "قابلیت requestContact در دسترس نیست."
        });
        return;
    }

    result.textContent = "منتظر پاسخ ایتا هستیم...";

    webApp.requestContact((success, contactData) => {
        if (!success) {
            showResult({
                success: false,
                message: "اشتراک شماره تماس تأیید نشد."
            });
            return;
        }

        showResult({
            success: true,
            contactDataType: typeof contactData,
            contactDataStructure:
                inspectContactData(contactData)
        });
    });
});

    </script>
</body>
</html>
