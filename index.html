
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>آزمایش Mini App ایتا</title>

    <script src="https://developer.eitaa.com/eitaa-web-app.js"></script>

    <style>
        body {
            font-family: Tahoma, Arial, sans-serif;
            max-width: 650px;
            margin: 30px auto;
            padding: 20px;
            line-height: 2;
        }

        button {
            padding: 12px 18px;
            margin: 8px 0;
            cursor: pointer;
        }

        button:disabled {
            cursor: not-allowed;
            opacity: 0.6;
        }

        pre {
            direction: ltr;
            text-align: left;
            white-space: pre-wrap;
            overflow-wrap: anywhere;
            background: #f2f2f2;
            padding: 12px;
            border-radius: 8px;
        }
    </style>
</head>

<body>
    <h2>آزمایش اتصال به ایتا</h2>

    <p id="environment">در حال بررسی محیط اجرا...</p>
    <p id="initDataStatus"></p>

    <button id="contactButton" disabled>
        درخواست اشتراک شماره تماس
    </button>

    <button id="registerButton" disabled>
        ثبت‌نام در MainApi
    </button>

    <h3>نتیجه آزمایش</h3>
    <pre id="result">هنوز آزمایشی انجام نشده است.</pre>

    <script>
        const environment = document.getElementById("environment");
        const initDataStatus = document.getElementById("initDataStatus");
        const contactButton = document.getElementById("contactButton");
        const registerButton = document.getElementById("registerButton");
        const result = document.getElementById("result");

        /*const API_URL =
            "https://7k8xz7bn-7232.inc1.devtunnels.ms/api/v1/eitaa/users/register";*/

        const REGISTER_API_URL =
        "https://7k8xz7bn-7232.inc1.devtunnels.ms/api/v1/eitaa/users/register";

        const CONTACT_API_URL =
        "https://7k8xz7bn-7232.inc1.devtunnels.ms/api/v1/eitaa/users/contact";

        const webApp = window.Eitaa?.WebApp;

        // initData فقط در حافظه صفحه نگهداری می‌شود.
        let rawInitData = "";

        function showResult(data) {
            result.textContent = JSON.stringify(data, null, 2);
        }

        // بررسی محیط اجرا و دریافت initData
        if (!webApp) {
            environment.textContent =
                "SDK ایتا در دسترس نیست. صفحه را داخل Mini App ایتا باز کنید.";

            initDataStatus.textContent =
                "دریافت initData هنوز ممکن نیست.";
        } else {
            webApp.ready();

            rawInitData = webApp.initData || "";

            environment.textContent = "SDK ایتا شناسایی شد.";

            initDataStatus.textContent = rawInitData
                ? `initData دریافت شد؛ طول رشته: ${rawInitData.length} کاراکتر`
                : "initData خالی است؛ نحوه باز کردن Mini App را بررسی کنید.";

            contactButton.disabled =
                typeof webApp.requestContact !== "function";

            registerButton.disabled = rawInitData.length === 0;

            showResult({
                sdkAvailable: true,
                initDataReceived: rawInitData.length > 0,
                initDataLength: rawInitData.length,
                initDataKeys: rawInitData
                    ? [...new URLSearchParams(rawInitData).keys()]
                    : [],
                requestContactAvailable:
                    typeof webApp.requestContact === "function"
            });
        }

        // ثبت‌نام کاربر در MainApi
        async function registerUser() {
            if (!rawInitData) {
                showResult({
                    success: false,
                    message:
                        "initData خالی است. Mini App را داخل ایتا باز کنید."
                });
                return;
            }

            registerButton.disabled = true;
            result.textContent = "در حال ارسال درخواست به MainApi...";

            try {
                const response = await fetch(REGISTER_API_URL, {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        initData: rawInitData
                    })
                });

                const responseText = await response.text();

                let responseData;

                try {
                    responseData = responseText
                        ? JSON.parse(responseText)
                        : null;
                } catch {
                    responseData = responseText;
                }

                showResult({
                    httpStatus: response.status,
                    success: response.ok,
                    response: responseData
                });
            } catch (error) {
                showResult({
                    success: false,
                    message:
                        "ارتباط با MainApi برقرار نشد. وضعیت API، تونل و CORS را بررسی کنید.",
                    error: error.message
                });
            } finally {
                registerButton.disabled = rawInitData.length === 0;
            }
        }

        registerButton.addEventListener("click", registerUser);

        // درخواست اشتراک شماره تماس از ایتا
        contactButton.addEventListener("click", () => {
            if (
                !webApp ||
                typeof webApp.requestContact !== "function"
            ) {
                showResult({
                    success: false,
                    message: "قابلیت requestContact در دسترس نیست."
                });
                return;
            }

            result.textContent = "منتظر پاسخ ایتا هستیم...";

            webApp.requestContact((success, contactData) => {
                if (!success || contactData?.status !== "sent") {
                    showResult({
                        success: false,
                        message: "اشتراک شماره تماس تأیید نشد."
                    });
                    return;
                }

                const signedContactData = contactData.response;

                showResult({
                    success: true,
                    status: contactData.status,
                    signedDataType: typeof signedContactData,
                    signedDataLength:
                        typeof signedContactData === "string"
                            ? signedContactData.length
                            : null,
                    signedDataReceived:
                        typeof signedContactData === "string" &&
                        signedContactData.length > 0
                });
            });

            /*webApp.requestContact((success, contactData) => {
                if (!success) {
                    showResult({
                        success: false,
                        message: "اشتراک شماره تماس تأیید نشد."
                    });
                    return;
                }

                const responseUnsafe = contactData?.responseUnsafe;
                const contact = responseUnsafe?.contact;

                // فقط نام فیلدها و وضعیت وجود آن‌ها نمایش داده می‌شود.
                // شماره تماس، hash و initData نمایش داده نمی‌شوند.
                showResult({
                    success: true,
                    status: contactData?.status,

                    responseUnsafeType: typeof responseUnsafe,

                    responseFields:
                        responseUnsafe &&
                        typeof responseUnsafe === "object"
                            ? Object.keys(responseUnsafe)
                            : [],

                    hasAuthDate:
                        Boolean(responseUnsafe?.auth_date),

                    hasHash:
                        Boolean(responseUnsafe?.hash),

                    hasContact:
                        Boolean(contact),

                    contactType:
                        typeof contact,

                    contactFields:
                        contact &&
                        typeof contact === "object"
                            ? Object.keys(contact)
                            : []
                });
            });*/
        });
    </script>
</body>
</html>
